<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythoria</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen bg-slate-950 bg-[url('../assets/images/Château-gothique.png')] bg-cover bg-center bg-no-repeat text-white">

  <header >
    <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-6 py-3" aria-label="Navigation principale">
      <a href="./index.html" class="font-serif text-2xl font-bold tracking-wide text-amber-400">
        <img src="./assets/images/logo.png" alt="" class="w-[100px] h-auto">
      </a>

      <div class="flex flex-wrap items-center justify-center gap-6 text-sm text-slate-200">
        <a class="border-b-2 border-amber-400 py-2 text-amber-300" href="./index.html" aria-current="page">Accueil</a>
        <a class="py-2 hover:text-amber-300" href="./shop.html">Boutique</a>
        <a class="py-2 hover:text-amber-300" href="./grimoire.html">Grimoire</a>
        <a class="py-2 hover:text-amber-300" href="./deck.html">Mon deck</a>
      </div>


    </nav>
  </header>
  <main class="relative isolate flex min-h-[calc(100vh-64px)] items-center overflow-hidden">
    <section class="mx-auto -translate-y-28 grid w-full max-w-6xl items-center gap-10 px-6 py-16 md:grid-cols-2 md:py-24">
      <div class="max-w-xl">
        <img src="./assets/images/logo.png" alt="Mythoria" class="mb-7 w-full max-w-[390px]">
        <p class="mb-5 text-xs uppercase tracking-[0.22em] text-amber-100 sm:text-sm">

          Combattez <span class="mx-2 text-amber-400">·</span>

        </p>
        <p class="mb-7 max-w-md font-serif leading-7 text-slate-200">
          Plongez dans un univers de cartes où chaque héros,<br class="hidden sm:block">
          chaque monstre et chaque sort peut changer le cours<br class="hidden sm:block">
          de votre destin.
        </p>
        <div class="flex flex-col gap-4 sm:flex-row">
          <a href="./shop.html" class="inline-flex items-center justify-center gap-3 rounded-md border border-amber-400 bg-amber-500 px-5 py-3 text-sm font-semibold text-slate-950 shadow-lg shadow-amber-950/30 transition hover:bg-amber-300">
            <span aria-hidden="true">♟</span>
            Découvrir les boosters
            <span aria-hidden="true">→</span>
          </a>
          <a href="./grimoire.html" class="inline-flex items-center justify-center gap-3 rounded-md border border-amber-400 px-5 py-3 text-sm text-amber-50 transition hover:bg-amber-400/10">
            <span aria-hidden="true">▢</span>
            Ouvrir mon grimoire
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>
      <div aria-hidden="true" class="hidden md:block"></div>
    </section>
